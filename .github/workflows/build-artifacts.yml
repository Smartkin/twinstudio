name: Build Artifacts

on:
  workflow_dispatch:

jobs:
  build-artifacts:
    name: Build artifacts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev \
            pkg-config nasm

      - name: Cache vcpkg packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/buildtrees
            /usr/local/share/vcpkg/packages
          key: vcpkg-ffmpeg-x64-linux-${{ hashFiles('.github/workflows/build-artifacts.yml') }}

      - name: Install Linux dependencies (FFmpeg via vcpkg)
        if: runner.os == 'Linux'
        run: |
          vcpkg install ffmpeg:x64-linux
          echo "PKG_CONFIG_PATH=$VCPKG_INSTALLATION_ROOT/installed/x64-linux/lib/pkgconfig" >> $GITHUB_ENV

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\buildtrees
            C:\vcpkg\packages
          key: vcpkg-ffmpeg-x64-windows-${{ hashFiles('.github/workflows/build-artifacts.yml') }}

      - name: Install Windows dependencies (FFmpeg via vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows pkgconf:x64-windows
          echo "PKG_CONFIG_EXECUTABLE=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\pkgconf\pkgconf.exe" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B ${{ github.workspace }}/build
          -A x64
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPKG_CONFIG_EXECUTABLE=${{ env.PKG_CONFIG_EXECUTABLE }}
          -S ${{ github.workspace }}

      - name: Build
        run: >
          cmake --build ${{ github.workspace }}/build
          --config ${{ matrix.build_type }}

      - name: Stage twinmusic artifact
        shell: bash
        run: |
          mkdir -p staging/twinmusic
          find build/src/music_manager -maxdepth 2 -type f \( -name 'twinmusic' -o -name 'twinmusic.exe' \) -exec cp {} staging/twinmusic/ \;
          cp -r build/src/music_manager/resources staging/twinmusic/resources

      - name: Stage twinpss artifact
        shell: bash
        run: |
          mkdir -p staging/twinpss
          find build/src/pss_editor -maxdepth 2 -type f \( -name 'twinpss' -o -name 'twinpss.exe' \) -exec cp {} staging/twinpss/ \;
          cp -r build/src/pss_editor/resources staging/twinpss/resources
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/"*.dll staging/twinpss/
          fi

      - name: Upload twinmusic artifact
        uses: actions/upload-artifact@v4
        with:
          name: twinmusic-${{ matrix.os }}
          path: staging/twinmusic
          if-no-files-found: error

      - name: Upload twinpss artifact
        uses: actions/upload-artifact@v4
        with:
          name: twinpss-${{ matrix.os }}
          path: staging/twinpss
          if-no-files-found: error
